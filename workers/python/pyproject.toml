[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "audiobook-worker"
version = "0.1.0"
description = "Local processing workers for the audiobook generator"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0"
]

[project.scripts]
audiobook-worker = "audiobook_worker.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

